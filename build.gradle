buildscript {
    ext {
        agp_gradle = libs.versions.agp.get()
        kotlin_version = libs.versions.kotlin.asProvider().get()
        navigation_version = libs.versions.androidx.navigation.get()
        coroutine_version = "1.6.4"
        jb_compose_version = libs.versions.jetbrains.compose.multiplatform.get()
    }

    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url = uri('https://maven.pkg.jetbrains.space/public/p/compose/dev')
        }
    }
}

plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.android.kotlin.multiplatform.library) apply false

    alias(libs.plugins.kotlin.jvm) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.multiplatform) apply false

    alias(libs.plugins.jetbrains.compose) apply false
    alias(libs.plugins.compose.compiler) apply false

    alias(libs.plugins.kotlin.serialization) apply false

    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.google.services) apply false
    alias(libs.plugins.svgToCompose) apply false
}

subprojects {
    apply plugin: 'maven-publish'

    tasks.matching { it.name.startsWith("publish") }.configureEach {
        doLast {
            def userHome = System.getProperty("user.home")
            def mavenLocalDir = new File(userHome, ".m2/repository/com/github/cybernhl/SDK")
            if (mavenLocalDir.exists()) {
                mavenLocalDir.eachFileRecurse { file ->
                    if (file.isFile() && file.name.endsWith("-metadata.jar")) {
                        def targetFile = new File(file.parentFile, file.name.replace("-metadata.jar", ".jar"))
                        if (!targetFile.exists()) {
                            targetFile.bytes = file.bytes
                        }
                    }
                }
            }
        }
    }
}
